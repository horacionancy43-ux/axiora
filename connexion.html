<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiora — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f0f0f; color: #f0f0f0; display: flex; flex-direction: column; min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 40px; border-bottom: 1px solid #1f1f1f;
      background: #0f0f0f;
    }
    .logo { font-size: 20px; font-weight: 600; color: #7F77DD; text-decoration: none; }
    .logo span { color: #f0f0f0; }

    .main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #141414; border: 1px solid #1f1f1f; border-radius: 16px;
      padding: 36px; width: 100%; max-width: 400px;
    }
    .card-header { text-align: center; margin-bottom: 28px; }
    .card-icon { font-size: 36px; margin-bottom: 12px; }
    .card-header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .card-header p { font-size: 14px; color: #777; }

    .form-group { margin-bottom: 16px; }
    .form-group label { font-size: 13px; color: #aaa; font-weight: 500; display: block; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 11px 14px; background: #0f0f0f;
      border: 1px solid #2a2a2a; border-radius: 8px; color: #f0f0f0;
      font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color .2s;
    }
    .form-group input:focus { border-color: #534AB7; }
    .forgot { font-size: 12px; color: #7F77DD; text-decoration: none; float: right; margin-top: -20px; display: block; text-align: right; }

    .btn-submit {
      width: 100%; padding: 12px; background: #534AB7; color: #fff; border: none;
      border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer;
      font-family: 'Inter', sans-serif; margin-top: 8px; transition: background .2s;
    }
    .btn-submit:hover { background: #6B62D4; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #1f1f1f; }
    .divider span { font-size: 12px; color: #555; }

    .btn-discord {
      width: 100%; padding: 11px; background: #5865F2; color: #fff; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer;
      font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-discord:hover { background: #4752C4; }

    .signup-link { text-align: center; margin-top: 20px; font-size: 14px; color: #777; }
    .signup-link a { color: #7F77DD; text-decoration: none; font-weight: 500; }

    .security-note {
      display: flex; align-items: center; gap: 8px; background: #1a1830;
      border: 1px solid #2e2a5e; border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #9D96E8; margin-top: 20px;
    }

    footer { padding: 20px 40px; text-align: center; border-top: 1px solid #1f1f1f; }
    .footer-copy { font-size: 12px; color: #444; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">Axio<span>ra</span></a>
  </nav>

  <div class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-icon">🔐</div>
        <h1>Connexion</h1>
        <p>Accédez à votre espace client Axiora</p>
      </div>

      <div class="form-group">
        <label>Adresse e-mail</label>
        <input type="email" placeholder="jean.dupont@email.com">
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" placeholder="••••••••">
      </div>

      <a href="#" class="forgot">Mot de passe oublié ?</a>

      <button class="btn-submit" onclick="connecter()">Se connecter</button>

      <div class="divider"><span>ou</span></div>

      <button class="btn-discord">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.001.022.015.04.037.05a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Continuer avec Discord
      </button>

      <div class="signup-link">
        Pas encore de compte ? <a href="/inscription">Créer un compte</a>
      </div>

      <div class="security-note">
        🔒 Connexion sécurisée — vos données sont chiffrées
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-copy">© 2026 Axiora. Tous droits réservés.</div>
  </footer>

<script>
  const API_URL = 'https://axiora-production.up.railway.app';

  async function connecter() {
    const email = document.querySelector('input[type="email"]').value.trim();
    const password = document.querySelector('input[type="password"]').value;

    if (!email || !password) {
      alert('Veuillez remplir tous les champs !');
      return;
    }

    const btn = document.querySelector('.btn-submit');
    btn.textContent = 'Connexion en cours...';
    btn.disabled = true;

    try {
      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (data.success) {
        localStorage.setItem('axiora_user', JSON.stringify(data.user));
        localStorage.setItem('axiora_session', JSON.stringify(data.session));
        window.location.href = '/dashboard';
      } else {
        alert('Erreur : ' + (data.error || 'Email ou mot de passe incorrect'));
        btn.textContent = 'Se connecter';
        btn.disabled = false;
      }
    } catch (err) {
      alert('Erreur de connexion au serveur');
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    }
  }
</script></body>
</html>
